<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de TMB</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #111114;
    --surface:    #1a1a20;
    --surface2:   #22222a;
    --border:     #2e2e3a;
    --accent:     #ff7b2c;
    --accent-glow:#ff7b2c44;
    --accent-soft:#ff9a5c;
    --text:       #f0eee8;
    --muted:      #7a7a8a;
    --danger:     #ff4f4f;
    --radius:     16px;
    --radius-sm:  10px;
    --radius-xs:  8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 85% 10%, rgba(255,123,44,0.09) 0%, transparent 60%),
      radial-gradient(ellipse 40% 35% at 5%  90%, rgba(255,123,44,0.06) 0%, transparent 55%);
    pointer-events: none;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    position: relative;
  }

  header {
    margin-bottom: 1.8rem;
    padding: 0 0.25rem;
  }

  .label-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(255,123,44,0.12);
    border-radius: 100px;
    padding: 0.3rem 0.8rem;
    margin-bottom: 1rem;
  }

  .label-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.5rem;
    font-weight: 500;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.6rem;
    box-shadow: 0 4px 40px rgba(0,0,0,0.4);
  }

  .sex-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1.6rem;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 0.3rem;
  }

  .sex-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 0.6rem 0.5rem;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all 0.22s ease;
  }

  .sex-toggle button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px var(--accent-glow);
  }

  .sex-toggle button:not(.active):hover {
    color: var(--text);
    background: var(--border);
  }

  .field { margin-bottom: 1.1rem; }

  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.45rem;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  input[type="number"] {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    padding: 0.7rem 0.9rem;
    outline: none;
    width: 100%;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .unit {
    display: flex;
    align-items: center;
    padding: 0 0.9rem;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(255,123,44,0.08);
    border-left: 1.5px solid var(--border);
    white-space: nowrap;
  }

  .btn-calc {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.95rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    margin-top: 0.5rem;
    transition: all 0.2s;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  .btn-calc:hover {
    background: var(--accent-soft);
    box-shadow: 0 6px 28px rgba(255,123,44,0.5);
    transform: translateY(-1px);
  }

  .btn-calc:active { transform: scale(0.98); }

  .result-box {
    margin-top: 1.4rem;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem;
    display: none;
    animation: fadeUp 0.3s ease forwards;
  }

  .result-box.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.3rem;
  }

  .result-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .result-badge {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(255,123,44,0.12);
    border-radius: 100px;
    padding: 0.2rem 0.55rem;
  }

  .result-value {
    font-family: 'Syne', sans-serif;
    font-size: 3.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .result-unit {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  .formula-row {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    background: rgba(255,123,44,0.05);
    border: 1px solid rgba(255,123,44,0.15);
    border-radius: var(--radius-xs);
    font-size: 0.66rem;
    color: var(--muted);
    line-height: 1.9;
    font-weight: 500;
  }

  .formula-row strong { color: var(--accent-soft); }

  .activity-section {
    margin-top: 1.2rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--border);
  }

  .activity-title {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.7rem;
  }

  .activity-grid {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .activity-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0.8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    font-size: 0.67rem;
    font-weight: 600;
    transition: border-color 0.15s, background 0.15s;
  }

  .activity-item:hover {
    border-color: rgba(255,123,44,0.35);
    background: rgba(255,123,44,0.04);
  }

  .act-name { color: var(--muted); }
  .act-val  { color: var(--accent); font-weight: 800; }

  .error {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--danger);
    margin-top: 0.5rem;
    display: none;
    background: rgba(255,79,79,0.08);
    border-radius: var(--radius-xs);
    padding: 0.4rem 0.7rem;
  }

  footer {
    margin-top: 1rem;
    font-size: 0.6rem;
    color: var(--muted);
    opacity: 0.5;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label-tag">Calculadora</div>
    <h1>Taxa Metabólica<br><span>Basal</span></h1>
    <p class="subtitle">Fórmula de Mifflin-St Jeor · 1990</p>
  </header>

  <div class="card">
    <div class="sex-toggle">
      <button class="active" id="btn-m" onclick="setSex('M')">♂ Masculino</button>
      <button id="btn-f" onclick="setSex('F')">♀ Feminino</button>
    </div>

    <div class="field">
      <label>Peso</label>
      <div class="input-row">
        <input type="number" id="peso" placeholder="70" min="20" max="300" step="0.1">
        <div class="unit">kg</div>
      </div>
    </div>

    <div class="field">
      <label>Altura</label>
      <div class="input-row">
        <input type="number" id="altura" placeholder="175" min="100" max="250" step="1">
        <div class="unit">cm</div>
      </div>
    </div>

    <div class="field">
      <label>Idade</label>
      <div class="input-row">
        <input type="number" id="idade" placeholder="25" min="1" max="120" step="1">
        <div class="unit">anos</div>
      </div>
      <div class="error" id="err">⚠ Preencha todos os campos corretamente.</div>
    </div>

    <button class="btn-calc" onclick="calcular()">Calcular TMB →</button>

    <div class="result-box" id="result">
      <div class="result-top">
        <div class="result-label">Sua TMB é</div>
        <div class="result-badge">kcal / dia</div>
      </div>
      <div class="result-value" id="res-val">—</div>
      <div class="result-unit">calorias necessárias em repouso</div>

      <div class="formula-row" id="formula-detail"></div>

      <div class="activity-section">
        <div class="activity-title">Gasto por nível de atividade</div>
        <div class="activity-grid" id="act-grid"></div>
      </div>
    </div>
  </div>

  <footer>Mifflin MD, St Jeor ST, et al. — J Am Diet Assoc. 1990</footer>
</div>

<script>
  let sexo = 'M';

  function setSex(s) {
    sexo = s;
    document.getElementById('btn-m').classList.toggle('active', s === 'M');
    document.getElementById('btn-f').classList.toggle('active', s === 'F');
  }

  function calcular() {
    const peso   = parseFloat(document.getElementById('peso').value);
    const altura = parseFloat(document.getElementById('altura').value);
    const idade  = parseFloat(document.getElementById('idade').value);
    const err    = document.getElementById('err');

    if (!peso || !altura || !idade || peso < 20 || altura < 100 || idade < 1) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';

    const base = (10 * peso) + (6.25 * altura) - (5 * idade);
    const tmb  = sexo === 'M' ? base + 5 : base - 161;
    const tmbR = Math.round(tmb);

    document.getElementById('res-val').textContent = tmbR.toLocaleString('pt-BR');

    const sinal = sexo === 'M' ? '+5' : '−161';
    document.getElementById('formula-detail').innerHTML =
      `<strong>Cálculo:</strong> (10 × ${peso}) + (6,25 × ${altura}) − (5 × ${idade}) ${sinal}<br>` +
      `= ${Math.round(10*peso)} + ${Math.round(6.25*altura)} − ${5*idade} ${sinal} = <strong>${tmbR} kcal</strong>`;

    const fatores = [
      { nome: 'Sedentário (sem exercício)',           fat: 1.2   },
      { nome: 'Levemente ativo (1–3x/sem)',           fat: 1.375 },
      { nome: 'Moderadamente ativo (3–5x/sem)',       fat: 1.55  },
      { nome: 'Muito ativo (6–7x/sem intenso)',       fat: 1.725 },
      { nome: 'Extremamente ativo (atleta / 2x/dia)', fat: 1.9   },
    ];

    document.getElementById('act-grid').innerHTML = fatores.map(f =>
      `<div class="activity-item">
        <span class="act-name">${f.nome}</span>
        <span class="act-val">${Math.round(tmb * f.fat).toLocaleString('pt-BR')} kcal</span>
      </div>`
    ).join('');

    const box = document.getElementById('result');
    box.classList.remove('show');
    void box.offsetWidth;
    box.classList.add('show');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') calcular(); });
</script>
</body>
</html>
