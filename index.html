<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Fernando Garcia Rangel">
<meta name="description" content="Calcule sua taxa metabólica basal (TMB) com a fórmula de Mifflin-St Jeor. Estimativa de gasto por nível de atividade.">
<meta name="theme-color" content="#111114">
<meta property="og:title" content="Calculadora de TMB">
<meta property="og:description" content="TMB com Mifflin-St Jeor (1990) — gasto estimado por atividade.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://calculadora-tmb-five.vercel.app/">
<meta name="twitter:card" content="summary">
<title>Calculadora de TMB</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="label-tag">Calculadora</div>
    <h1>Taxa Metabólica<br><span>Basal</span></h1>
    <p class="subtitle">Fórmula de Mifflin-St Jeor · 1990</p>
  </header>

  <div class="card">
    <div class="sex-toggle" role="group" aria-label="Sexo (fórmula Mifflin-St Jeor)">
      <button type="button" class="active" id="btn-m" aria-pressed="true">♂ Masculino</button>
      <button type="button" id="btn-f" aria-pressed="false">♀ Feminino</button>
    </div>

    <div class="field">
      <label for="peso">Peso</label>
      <div class="input-row">
        <input type="number" id="peso" name="peso" placeholder="70" min="20" max="300" step="0.1" inputmode="decimal" autocomplete="off" aria-invalid="false">
        <div class="unit">kg</div>
      </div>
    </div>

    <div class="field">
      <label for="altura">Altura</label>
      <div class="input-row">
        <input type="number" id="altura" name="altura" placeholder="175" min="100" max="250" step="1" inputmode="numeric" autocomplete="off" aria-invalid="false">
        <div class="unit">cm</div>
      </div>
    </div>

    <div class="field">
      <label for="idade">Idade</label>
      <div class="input-row">
        <input type="number" id="idade" name="idade" placeholder="25" min="1" max="120" step="1" inputmode="numeric" autocomplete="off" aria-invalid="false">
        <div class="unit">anos</div>
      </div>
      <div class="error" id="err" role="alert">⚠ Preencha peso, altura e idade.</div>
    </div>

    <button type="button" class="btn-calc" id="btn-calc">Calcular TMB →</button>

    <div class="result-box" id="result" role="region" aria-live="polite" aria-label="Resultado do cálculo">
      <div class="result-top">
        <div class="result-label">Sua TMB é</div>
        <div class="result-badge">kcal / dia</div>
      </div>
      <div class="result-value" id="res-val">—</div>
      <div class="result-unit">calorias necessárias em repouso</div>

      <div class="result-actions">
        <button type="button" class="btn-copy" id="btn-copy">Copiar resumo</button>
        <span class="copy-feedback" id="copy-feedback" aria-live="polite"></span>
      </div>

      <div class="formula-row" id="formula-detail"></div>

      <div class="activity-section">
        <div class="activity-title">Gasto por nível de atividade</div>
        <div class="activity-grid" id="act-grid"></div>
      </div>
    </div>
  </div>

  <footer>
    Mifflin MD, St Jeor ST, et al. — J Am Diet Assoc. 1990
    <span class="footer-author">Desenvolvido por Fernando Garcia Rangel</span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
